<svg xmlns="http://www.w3.org/2000/svg" width="660mm" height="546mm" viewBox="0 0 660 546"
     role="img" aria-labelledby="titulo desc">
  <title id="titulo">Distribuição das classes no conjunto de dados</title>
  <desc id="desc">Gráfico de barras verticais com o número de pacientes por classe clínica: Normal 687, Laringite 140, Disfonia Psicogênica 91, Disfonia Funcional 112, Edema de Reinke 68. Total de 1098 pacientes, com forte desequilíbrio a favor da classe Normal (62,6%).</desc>

  <defs>
    <style>
      .lbl { font-family: Calibri, Carlito, "Segoe UI", "Liberation Sans", Arial, sans-serif; }
    </style>
  </defs>

  <!-- fundo -->
  <rect x="0" y="0" width="660" height="546" fill="#fcfcfb"/>

  <!-- titulo e subtitulo -->
  <text class="lbl" x="50" y="38" font-size="21.17" font-weight="700" fill="#0b0b0b">Distribuição das classes no conjunto de dados</text>
  <text class="lbl" x="50" y="62" font-size="14.82" fill="#52514e">N = 1098 pacientes · Base SVD · 5 classes clínicas</text>

  <!-- eixo Y: titulo rotacionado -->
  <text class="lbl" x="18" y="255" font-size="14.82" fill="#52514e" text-anchor="middle"
        transform="rotate(-90 18 255)">Número de pacientes</text>

  <!-- linhas de grade horizontais (a cada 100 pacientes) -->
  <g stroke="#e1e0d9" stroke-width="1.3">
    <line x1="50" y1="375" x2="640" y2="375"/>
    <line x1="50" y1="335" x2="640" y2="335"/>
    <line x1="50" y1="295" x2="640" y2="295"/>
    <line x1="50" y1="255" x2="640" y2="255"/>
    <line x1="50" y1="215" x2="640" y2="215"/>
    <line x1="50" y1="175" x2="640" y2="175"/>
    <line x1="50" y1="135" x2="640" y2="135"/>
  </g>

  <!-- rotulos do eixo Y -->
  <g class="lbl" font-size="12.70" fill="#898781" text-anchor="end">
    <text x="47" y="419">0</text>
    <text x="47" y="379">100</text>
    <text x="47" y="339">200</text>
    <text x="47" y="299">300</text>
    <text x="47" y="259">400</text>
    <text x="47" y="219">500</text>
    <text x="47" y="179">600</text>
    <text x="47" y="139">700</text>
  </g>

  <!-- eixo base -->
  <line x1="50" y1="415" x2="640" y2="415" stroke="#c3c2b7" stroke-width="2.1"/>

  <!-- barras: base quadrada na linha de base, topo arredondado (raio 10mm) -->
  <!-- Normal: 687 pacientes -->
  <path d="M 74,415 L 74,150.2 Q 74,140.2 84,140.2 L 134,140.2 Q 144,140.2 144,150.2 L 144,415 Z" fill="#2a78d6"/>
  <!-- Laringite: 140 pacientes -->
  <path d="M 192,415 L 192,369 Q 192,359 202,359 L 252,359 Q 262,359 262,369 L 262,415 Z" fill="#eb6834"/>
  <!-- Disfonia Psicogênica: 91 pacientes -->
  <path d="M 310,415 L 310,388.6 Q 310,378.6 320,378.6 L 370,378.6 Q 380,378.6 380,388.6 L 380,415 Z" fill="#1baf7a"/>
  <!-- Disfonia Funcional: 112 pacientes -->
  <path d="M 428,415 L 428,380.2 Q 428,370.2 438,370.2 L 488,370.2 Q 498,370.2 498,380.2 L 498,415 Z" fill="#eda100"/>
  <!-- Edema de Reinke: 68 pacientes -->
  <path d="M 546,415 L 546,397.8 Q 546,387.8 556,387.8 L 606,387.8 Q 616,387.8 616,397.8 L 616,415 Z" fill="#e87ba4"/>

  <!-- rotulos diretos: contagem (negrito, tinta) + percentual (tinta muted) -->
  <g class="lbl" text-anchor="middle">
    <text x="109" y="116.9" font-size="19.05" font-weight="700" fill="#0b0b0b">687</text>
    <text x="109" y="131.7" font-size="12.70" fill="#898781">(62,6%)</text>

    <text x="227" y="335.7" font-size="19.05" font-weight="700" fill="#0b0b0b">140</text>
    <text x="227" y="350.5" font-size="12.70" fill="#898781">(12,8%)</text>

    <text x="345" y="355.3" font-size="19.05" font-weight="700" fill="#0b0b0b">91</text>
    <text x="345" y="370.1" font-size="12.70" fill="#898781">(8,3%)</text>

    <text x="463" y="346.9" font-size="19.05" font-weight="700" fill="#0b0b0b">112</text>
    <text x="463" y="361.7" font-size="12.70" fill="#898781">(10,2%)</text>

    <text x="581" y="364.5" font-size="19.05" font-weight="700" fill="#0b0b0b">68</text>
    <text x="581" y="379.3" font-size="12.70" fill="#898781">(6,2%)</text>
  </g>

  <!-- rotulos do eixo X (nome das classes, duas linhas quando necessario) -->
  <g class="lbl" font-size="16.23" font-weight="600" fill="#52514e" text-anchor="middle">
    <text x="109" y="440.4">Normal</text>

    <text x="227" y="440.4">Laringite</text>

    <text x="345" y="440.4">Disfonia</text>
    <text x="345" y="459.45">Psicogênica</text>

    <text x="463" y="440.4">Disfonia</text>
    <text x="463" y="459.45">Funcional</text>

    <text x="581" y="440.4">Edema de</text>
    <text x="581" y="459.45">Reinke</text>
  </g>

  <!-- separador -->
  <line x1="50" y1="476.4" x2="640" y2="476.4" stroke="#e1e0d9" stroke-width="1.1"/>

  <!-- legenda textual do desequilibrio -->
  <text class="lbl" x="50" y="497" font-size="9.88" font-style="italic" fill="#52514e">Desequilíbrio severo entre classes: a classe Normal concentra 62,6% dos pacientes;</text>
  <text class="lbl" x="50" y="512" font-size="9.88" font-style="italic" fill="#52514e">as quatro classes patológicas somam, juntas, apenas 37,4% da amostra.</text>

  <!-- fonte dos dados -->
  <text class="lbl" x="50" y="528" font-size="7.76" fill="#898781">Fonte: overview_merged.csv + diretórios de áudio (base SVD) — 1098 pacientes válidos, dataset_load()</text>
</svg>
